apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z compose-vote-db 5432; do
                echo "DB 대기중..."
                sleep 2
              done
              echo "DB 연결 확인 완료!"

      containers:
        - name: django-web
          image: {{ .Values.web.image }}
          imagePullPolicy: {{ .Values.web.imagePullPolicy }}

          command: ["sh", "-c"]
          args:
            - |
              # 메뉴 크롤링과 관리자 계정 생성은 Admin에서 수동 처리
              echo "===== 1단계: 마이그레이션 적용 (없으면 no-op) ====="
              python manage.py migrate --noinput

              echo "===== 2단계: Django 웹 서버 기동 ====="
              python manage.py runserver 0.0.0.0:{{ .Values.web.port }}

          env:
            - name: DEBUG
              value: "0"
            - name: USE_SQLITE
              value: "0"
            - name: POSTGRES_HOST
              value: compose-vote-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}

          ports:
            - containerPort: {{ .Values.web.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-svc
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
